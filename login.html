<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VaultX | Customer Portal Login</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg width='32' height='32' viewBox='0 0 24 24' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z' stroke='%23D4AF37' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M9 12l2 2 4-4' stroke='%230F172A' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;1,700&family=Barlow:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Chakra+Petch:ital,wght@0,500;0,600;0,700;1,600&family=Rajdhani:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .auth-layout { min-height: 100vh; display: flex; background: var(--bg-primary); }
        .auth-form-side { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px; position: relative; }
        .auth-toggles { position: absolute; top: 30px; right: 40px; display: flex; gap: 15px; z-index: 100; }
        .glass-card { background: var(--glass-bg); backdrop-filter: blur(20px); border: 1px solid var(--glass-border); border-radius: 24px; padding: 50px 40px; width: 100%; max-width: 480px; box-shadow: var(--shadow-lg); }
        .btn-social {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            border-radius: 12px;
            font-family: var(--font-body);
            transition: all var(--transition-fast);
        }
        .btn-social:hover {
            background: var(--bg-primary);
            border-color: var(--brand-accent);
            color: var(--brand-accent);
            transform: translateY(-2px);
            box-shadow: var(--shadow-sm);
        }
        .glass-card a.text-accent {
            transition: all var(--transition-fast);
            text-decoration: none;
            display: inline-block;
        }
        .glass-card a.text-accent:hover {
            color: var(--brand-accent-hover) !important;
            text-decoration: underline !important;
            text-underline-offset: 3px;
            transform: translateY(-1px);
        }
        @media (max-width: 767px) {
            .auth-form-side {
                padding: 75px 16px 40px;
            }
            .auth-toggles {
                top: 16px;
                right: 16px;
                gap: 10px;
            }
            .glass-card {
                padding: 35px 20px;
                border-radius: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="auth-layout">
        <div class="auth-toggles">
            <button class="icon-btn theme-toggle-btn" title="Toggle Theme" aria-label="Toggle theme"><i class="bi bi-moon"></i></button>
            <button class="icon-btn rtl-toggle-btn" title="Toggle RTL" aria-label="Toggle RTL"><i class="bi bi-arrow-left-right"></i></button>
        </div>
        <div class="auth-form-side">
            <div class="glass-card">
                <div class="text-center mb-4">
                    <a href="index.html" class="logo justify-content-center mb-3">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="margin-right: 8px;">
    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" stroke="var(--brand-accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M9 12l2 2 4-4" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
                        Vault<span>X</span>
                    </a>
                    <h4 class="fw-bold mb-1">Customer Portal Login</h4>
                    <p class="text-secondary small">Track shipments, view climate telemetry, and access condition reports.</p>
                </div>
                <form action="dashboard.html" method="GET">
                    <div class="mb-3">
                        <label class="form-label text-secondary small fw-bold">Email Address</label>
                        <input type="email" class="form-control" required value="alexander.vance@vancemotors.com">
                    </div>
                    <div class="mb-3">
                        <div class="d-flex justify-content-between">
                            <label class="form-label text-secondary small fw-bold">Password</label>
                            <a href="#" class="text-accent small" onclick="alert('Password reset link sent to your registered email.'); return false;">Forgot password?</a>
                        </div>
                        <input type="password" class="form-control" required value="password123">
                    </div>
                    <div class="form-check mb-4">
                        <input class="form-check-input" type="checkbox" id="rememberMe" checked>
                        <label class="form-check-label text-secondary small" for="rememberMe">Remember this browser</label>
                    </div>
                    <button type="submit" class="btn-premium primary w-100 mb-3">Sign In to Customer Dashboard</button>
                </form>

                <div class="d-flex align-items-center my-3">
                    <hr class="flex-grow-1 my-0 border-color">
                    <span class="px-3 text-secondary small fw-bold text-uppercase" style="font-size: 0.72rem; letter-spacing: 0.5px;">Or continue with</span>
                    <hr class="flex-grow-1 my-0 border-color">
                </div>

                <div class="row g-2 mb-2">
                    <div class="col-6">
                        <a href="dashboard.html" class="btn btn-social w-100 d-flex align-items-center justify-content-center gap-2 py-2 text-decoration-none">
                            <i class="bi bi-google text-danger fs-5"></i>
                            <span class="fw-semibold small">Google</span>
                        </a>
                    </div>
                    <div class="col-6">
                        <a href="dashboard.html" class="btn btn-social w-100 d-flex align-items-center justify-content-center gap-2 py-2 text-decoration-none">
                            <i class="bi bi-apple fs-5"></i>
                            <span class="fw-semibold small">Apple</span>
                        </a>
                    </div>
                </div>

                <div class="text-center mt-4 pt-3 border-top border-color">
                    <p class="text-secondary small mb-0">Don't have an account yet? <a href="signup.html" class="text-accent fw-bold">Create Collector Account</a></p>
                </div>
            </div>
        </div>
    </div>
    <script src="assets/js/main.js"></script>
</body>
</html>
